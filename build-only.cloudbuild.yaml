steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tabula-medica-api:${_TAG}", .]
  - name: gcr.io/cloud-builders/docker
    args: [push, "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tabula-medica-api:${_TAG}"]
images: ["us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/tabula-medica-api:${_TAG}"]
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
