# One-shot schema provisioning. Runs `drizzle-kit push` to create the PHR's full
# schema in the (currently empty) database the live service points at. Safe:
# the target DB has zero tables, so every statement is an additive CREATE — no
# renames/drops, hence no interactive prompts and no possible data loss.
# DATABASE_URL is injected from Secret Manager by Cloud Build (never leaves GCP).
availableSecrets:
  secretManager:
    - versionName: projects/united-planet-485003-n7/secrets/patient-db-secret-us-central1/versions/latest
      env: DATABASE_URL

steps:
  - id: drizzle-push
    name: node:20
    entrypoint: bash
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        set -euo pipefail
        echo "=== install deps (incl. dev, for drizzle-kit) ==="
        npm ci --include=dev --no-audit --no-fund
        echo "=== fetch cloud-sql-proxy ==="
        apt-get update -qq && apt-get install -y -qq wget postgresql-client >/dev/null
        wget -q -O /cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
        chmod +x /cloud-sql-proxy
        mkdir -p /cloudsql
        /cloud-sql-proxy --unix-socket /cloudsql \
          united-planet-485003-n7:us-central1:tabula-medica-db &
        for i in $(seq 1 15); do
          [ -S "/cloudsql/united-planet-485003-n7:us-central1:tabula-medica-db/.s.PGSQL.5432" ] && break
          sleep 1
        done
        echo "=== BEFORE: table count ==="
        psql "$$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"
        echo "=== drizzle-kit push ==="
        yes | npx drizzle-kit push
        echo "=== AFTER: table count + key tables ==="
        psql "$$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"
        psql "$$DATABASE_URL" -c "SELECT to_regclass('public.users') users, to_regclass('public.external_identities') ext_ident;"

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
