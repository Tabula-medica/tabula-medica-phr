        rel="stylesheet"

    <title>Tabula Medica — Your unified personal health record</title>

    <!--
      schema.org JSON-LD — emitted as a graph so Google, Bing, ChatGPT,
      Claude, and Perplexity can ground their answers in structured facts
      about the entity, the website, and the software product.

      Maintained as one block here (not per-page) because all marketing
      surfaces share the same brand entity. Page-specific structured data
      (Article, FAQPage, MedicalCondition) should be injected at the
      page-component level when those pages are built.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tabulamedica.health/#org",
            "name": "Tabula Medica",
            "legalName": "Tabula Medica LLC",
            "url": "https://tabulamedica.health/",
            "logo": "https://tabulamedica.health/logo.png",
            "sameAs": []
          },
          {
            "@type": "MedicalOrganization",
            "@id": "https://tabulamedica.health/#medorg",
            "name": "Tabula Medica",
            "url": "https://tabulamedica.health/",
            "logo": "https://tabulamedica.health/logo.png",
            "medicalSpecialty": "PrimaryCare",
            "description": "Patient-controlled unified personal health record. Aggregates clinical data from every connected EHR, lab, and pharmacy into one HIPAA-grade timeline.",
            "parentOrganization": { "@id": "https://tabulamedica.health/#org" }
          },
          {
            "@type": "WebSite",
            "@id": "https://tabulamedica.health/#website",
            "url": "https://tabulamedica.health/",
            "name": "Tabula Medica",
            "publisher": { "@id": "https://tabulamedica.health/#org" },
            "inLanguage": "en-US",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://tabulamedica.health/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://tabulamedica.health/#app",
            "name": "Tabula Medica",
            "applicationCategory": "HealthApplication",
            "applicationSubCategory": "Personal Health Record",
            "operatingSystem": "Web, iOS, Android",
            "url": "https://tabulamedica.health/",
            "publisher": { "@id": "https://tabulamedica.health/#org" },
            "offers": [
              {
                "@type": "Offer",
                "name": "Free",
                "price": "0",
                "priceCurrency": "USD",
                "category": "Free"
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "priceCurrency": "USD",
                "category": "Subscription"
              },
              {
                "@type": "Offer",
                "name": "Concierge",
                "priceCurrency": "USD",
                "category": "Subscription"
              }
            ],
            "featureList": [
              "Unified health timeline across every connected EHR",
              "SMART on FHIR connection to 30,000+ US health systems",
              "Patient-held encryption with zero-knowledge key model",
              "Family caregiver portal with minor and senior coverage",
              "Plain-English explanations of labs, diagnoses, and medications",
              "Symptom triage with deterministic red-flag rules",
              "GDPR and CCPA self-serve data subject request dashboards"
            ]
          }
        ]
      }
    </script>

    <!--
      Plausible Analytics — cookieless, GDPR/CCPA/PECR compliant by design,
      so it can load before any consent banner. Only fires on production
      hostnames; localhost / *.replit.dev / *.replit.app are filtered out
      by the data-exclude attribute below.
    -->
    <script
      defer
      data-domain="tabulamedica.health"
      data-exclude="/admin/**,/dashboard/**,/patient/**,/provider/**,/clinician/**,/settings/**,/onboarding/**,/consent,/auth/**"
      src="https://plausible.io/js/script.outbound-links.js"
    ></script>

    <!--
      Usercentrics Consent Management Platform — loads only when the build
      provides a settings ID via VITE_USERCENTRICS_SETTINGS_ID. The CMP
      itself decides which consent-gated vendors (ads, marketing, embedded
      media) are allowed to fire after the user's response. Plausible is
      not gated through it because Plausible is cookieless and lawful
      under GDPR Article 6(1)(f) without consent.
    -->
    <script>
      (function () {
        var SID = "%VITE_USERCENTRICS_SETTINGS_ID%";
        if (!SID || SID.indexOf("VITE_USERCENTRICS") !== -1) return;
        var s = document.createElement("script");
        s.id = "usercentrics-cmp";
        s.async = true;
        s.src = "https://app.usercentrics.eu/browser-ui/latest/loader.js";
        s.setAttribute("data-settings-id", SID);
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered:", registration.scope);
            })
            .catch((error) => {
              console.log("SW registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
