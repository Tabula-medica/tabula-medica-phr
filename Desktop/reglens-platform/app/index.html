<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is an F-tag in CMS nursing home surveys?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An F-tag is a regulatory citation code used by CMS surveyors when a skilled nursing facility is found out of compliance with federal requirements under 42 CFR Part 483. F-tags range from F550 (Resident Rights) through F950 (Pharmacy). Each F-tag maps to a specific regulation and can be cited at severity levels A through L, with J–L indicating Immediate Jeopardy."
      }
    },
    {
      "@type": "Question",
      "name": "How often are SNFs surveyed by CMS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CMS requires standard health surveys of skilled nursing facilities (SNFs) approximately every 12 months, with no more than 15 months between surveys. Facilities with prior deficiencies or complaint investigations may be surveyed more frequently. Life Safety Code surveys are conducted separately."
      }
    },
    {
      "@type": "Question",
      "name": "What are the most commonly cited F-tags?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The most commonly cited F-tags nationally include F684 (Quality of Care), F689 (Accident Prevention), F686 (Pressure Ulcer Treatment), F692 (Nutritional Status), F757 (Unnecessary Drugs), F880 (Infection Control), F838 (Facility Assessment), and F656 (Care Plan Development). RegLens tracks citation frequency and severity for all active F-tags."
      }
    },
    {
      "@type": "Question",
      "name": "What is Immediate Jeopardy in a CMS survey?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Immediate Jeopardy (IJ) is the most serious deficiency classification in CMS nursing home surveys, corresponding to severity levels J, K, and L. It indicates that a facility's non-compliance has caused or is likely to cause serious injury, harm, impairment, or death to a resident. IJ citations require immediate corrective action and can result in civil money penalties of $3,050–$10,000 per day."
      }
    }
  ]
}
</script>
