# OSV-Scanner configuration (v2 PackageOverrides / IgnoredVulns syntax).
#
# Policy: fix transitive vulnerabilities with npm overrides in package.json
# first (see the `overrides` block). Add an ignore entry here ONLY when the
# fixed version is a breaking major that a direct dependency cannot consume,
# and always record the reason and an expiry-style review note so the entry
# is re-evaluated instead of forgotten. `npm audit --omit=dev --audit-level=high`
# remains the blocking gate independent of this file.

[[IgnoredVulns]]
id = "GHSA-528h-pc64-c93x"
reason = """stream-json 1.9.1 via firebase-tools (CLI/deploy tooling, not a runtime server dependency). The fixed release (stream-json >= 3.5.0) drops the `stream-json/filters/*` and `stream-json/streamers/*` subpath entry points that firebase-tools 15.x requires (database/import, commands/auth-import, frameworks/next), so overriding it breaks `firebase` deploys. Review when firebase-tools ships a release depending on stream-json 3.x."""

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = """braces 3.0.3 (stack exhaustion on deeply nested glob patterns, no upstream fix: 3.0.3 is the latest release). Dev-only: reached via firebase-tools -> chokidar@3 and tailwindcss -> micromatch, both devDependencies, so it is absent from the production tree (`npm audit --omit=dev` is clean and the Dockerfile installs with `npm ci --omit=dev`). Inputs are glob patterns from local developer tooling, never user-supplied. Review by 2027-01-04 or as soon as braces publishes a fixed release."""
