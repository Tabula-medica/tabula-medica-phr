name: Assert Required Checks
description: |
  Mints a short-lived GitHub App installation token and verifies that every
  critical CI gate job is listed in the branch-protection required-status-checks
  for the protected branch.

  This composite action centralises the "Mint GitHub App token" +
  "Assert all critical CI jobs are in branch-protection required-checks" pair
  that used to be copy-pasted verbatim into server-tests, jest-tests,
  script-tests, and reviewer-login-gate. Adding a new critical job to
  CRITICAL_JOBS now requires a single change here rather than four.

  Token behaviour:
    - When gh_app_id and gh_app_private_key are both non-empty a short-lived
      installation token is minted via actions/create-github-app-token. Any
      401/403 from the branch-protection API is a hard failure — it means the
      App is misconfigured.
    - When either secret is absent (forks, repos without the App) the action
      falls back to github_token, which lacks repo-administration scope and
      receives HTTP 403. In that case a WARNING annotation is emitted and the
      action exits 0 so forks are unaffected.

inputs:
  gh_app_id:
    description: Numeric GitHub App ID (GH_APP_ID secret). Leave empty on forks.
    required: false
    default: ''
  gh_app_private_key:
    description: PEM private key for the GitHub App (GH_APP_PRIVATE_KEY secret). Leave empty on forks.
    required: false
    default: ''
  github_token:
    description: GITHUB_TOKEN from the calling job, used as the fallback when the App secrets are absent.
    required: true
  repo:
    description: Repository in owner/name format. Pass github.repository from the calling workflow.
    required: true
  protected_branch:
    description: Branch whose required-status-checks are verified.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Mint GitHub App token for branch-protection check
      id: app-token
      if: ${{ inputs.gh_app_id != '' && inputs.gh_app_private_key != '' }}
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.gh_app_id }}
        private-key: ${{ inputs.gh_app_private_key }}

    - name: Assert all critical CI jobs are in branch-protection required-checks
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.github_token }}
        APP_TOKEN_AVAILABLE: ${{ steps.app-token.outputs.token != '' }}
        REPO: ${{ inputs.repo }}
        PROTECTED_BRANCH: ${{ inputs.protected_branch }}
      run: |
        set -euo pipefail

        API="https://api.github.com/repos/${REPO}/branches/${PROTECTED_BRANCH}/protection/required_status_checks"
        HTTP_STATUS=$(curl -s -o /tmp/bp_response.json -w "%{http_code}" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${API}")

        if [ "${HTTP_STATUS}" = "401" ] || [ "${HTTP_STATUS}" = "403" ]; then
          if [ "${APP_TOKEN_AVAILABLE}" = "true" ]; then
            # A properly-installed GitHub App should never receive 401/403.
            # This indicates the app lacks the Administration: Read permission
            # or is not installed on this repo/org — treat as a hard failure.
            echo "::error title=Required-Checks API Error::GitHub App token received HTTP ${HTTP_STATUS} from the branch-protection API."
            echo "::error title=Required-Checks API Error::Ensure the GitHub App has 'Administration: Read' repository permission and is installed on this repository."
            cat /tmp/bp_response.json
            exit 1
          fi
          # No app configured (fork or repo without secrets) — soft warning only.
          echo "::warning title=Required-Checks Verification Skipped::Cannot read branch-protection settings (HTTP ${HTTP_STATUS} — token lacks repo-administration scope)."
          echo "::warning title=Required-Checks Verification Skipped::IMPORTANT: server-tests, jest-tests, reviewer-login-gate, and script-tests MUST all remain in the branch-protection required-status-checks for 'main' or their guard chains are broken."
          echo "::warning title=Required-Checks Verification Skipped::Register a GitHub App with 'Administration: Read' permission, then set GH_APP_ID and GH_APP_PRIVATE_KEY secrets to enable hard enforcement."
          exit 0
        fi

        if [ "${HTTP_STATUS}" != "200" ]; then
          echo "::error title=Required-Checks API Error::Unexpected HTTP ${HTTP_STATUS} from branch-protection API. See /tmp/bp_response.json for details."
          cat /tmp/bp_response.json
          exit 1
        fi

        # The GitHub API returns required checks in two shapes depending on
        # whether the repo uses classic branch protection or rulesets:
        #   .contexts[]          — flat list of check-context strings (classic)
        #   .checks[].context    — structured list with app_id (newer classic)
        # We accept either form and match on job IDs or display names.
        python3 - <<'PYEOF'
        import json, sys
        with open("/tmp/bp_response.json") as f:
            data = json.load(f)
        flat = set(data.get("contexts", []))
        structured = {c.get("context", "") for c in data.get("checks", []) if isinstance(c, dict)}
        all_contexts = flat | structured
        print(f"[branch-protection contexts found: {sorted(all_contexts)}]", file=sys.stderr)

        # Each entry is (job-id, display-name-alias).  A job is considered
        # present if either its job ID or display name appears in the list.
        CRITICAL_JOBS = [
            ("server-tests",        "Server Regression Tests"),
            ("jest-tests",          "Jest Tests (client)"),
            ("reviewer-login-gate", "Reviewer Login Gate (production)"),
            ("script-tests",        "Script Unit Tests (node:test)"),
        ]

        missing = []
        for job_id, display_name in CRITICAL_JOBS:
            if job_id not in all_contexts and display_name not in all_contexts:
                missing.append((job_id, display_name))

        if missing:
            for job_id, display_name in missing:
                print(
                    f"::error title=Canary Gate Broken::"
                    f"'{job_id}' ('{display_name}') is NOT in the branch-protection "
                    f"required-status-checks for 'main'. "
                    f"Fix: Settings → Branches → main → "
                    f"'Require status checks to pass before merging' → add '{job_id}'.",
                    file=sys.stderr,
                )
            print(
                f"FAIL: {len(missing)} critical CI gate(s) missing from required-status-checks: "
                + ", ".join(job_id for job_id, _ in missing)
            )
            sys.exit(1)

        print("OK: all critical CI gates confirmed in branch-protection required-status-checks for 'main'.")
        PYEOF
