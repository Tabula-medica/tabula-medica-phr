name: Release Notes

# Triggers on version tags (v1.2.3, v1.2.3-rc.1, etc.) pushed to GitHub.
# Generates a CHANGELOG.md entry from conventional commits since the previous
# tag, then creates a GitHub Release with those notes.
#
# Requirements:
#   - Commits follow Conventional Commits spec (feat:, fix:, chore:, etc.)
#   - GITHUB_TOKEN (automatic, no manual secret needed)
#   - `conventional-changelog-cli` is run via npx (no global install needed)
#
# The workflow does NOT build or deploy. It runs AFTER a tag is pushed and
# only creates the release artifact + changelog entry.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-notes:
    name: Generate Release Notes & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for conventional-changelog to walk tags
          # and build the full commit range for this release.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate CHANGELOG.md entries from conventional commits between
      # the previous tag and HEAD. --release-count 1 means only the
      # current release block is generated (appended to existing file).
      - name: Generate CHANGELOG.md
        run: |
          npx conventional-changelog-cli \
            --preset angular \
            --release-count 1 \
            --outfile CHANGELOG.md \
            --verbose

      # Extract just the latest release block from CHANGELOG.md so the
      # GitHub Release body contains only the current version's notes,
      # not the entire history. We use awk to grab lines between the first
      # two "## " headings (conventional-changelog output format).
      - name: Extract release notes for this tag
        id: notes
        run: |
          NOTES=$(awk '/^## /{found++} found==1{print} found==2{exit}' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No conventional-commit change log entries found for this tag."
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Commit the updated CHANGELOG.md back to main so the file stays in
      # sync with each release. The push uses the automatic GITHUB_TOKEN so
      # no extra secret is needed. We push to main, not to the tag branch.
      - name: Commit updated CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No CHANGELOG changes to commit" || \
            git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name }}"
          git push origin HEAD:main || echo "CHANGELOG push skipped (branch protection or nothing to push)"

      # Create the GitHub Release with the extracted notes. The release is
      # published immediately (not a draft) so CI pipelines and the deploy
      # workflow can gate on it if needed.
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
