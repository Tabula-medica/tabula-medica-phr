    <title>Tabula Medica — Your unified personal health record</title>

    <!--
      schema.org JSON-LD — emitted as a graph so Google, Bing, ChatGPT,
      Claude, and Perplexity can ground their answers in structured facts
      about the entity, the website, and the software product.

      Maintained as one block here (not per-page) because all marketing
      surfaces share the same brand entity. Page-specific structured data
      (Article, FAQPage, MedicalCondition) should be injected at the
      page-component level when those pages are built.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tabulamedica.health/#org",
            "name": "Tabula Medica",
            "legalName": "Tabula Medica LLC",
            "url": "https://tabulamedica.health/",
            "logo": "https://tabulamedica.health/logo.png",
            "sameAs": []
          },
          {
            "@type": "MedicalOrganization",
            "@id": "https://tabulamedica.health/#medorg",
            "name": "Tabula Medica",
            "url": "https://tabulamedica.health/",
            "logo": "https://tabulamedica.health/logo.png",
            "medicalSpecialty": "PrimaryCare",
            "description": "Patient-controlled unified personal health record. Aggregates clinical data from every connected EHR, lab, and pharmacy into one HIPAA-grade timeline.",
            "parentOrganization": { "@id": "https://tabulamedica.health/#org" }
          },
          {
            "@type": "WebSite",
            "@id": "https://tabulamedica.health/#website",
            "url": "https://tabulamedica.health/",
            "name": "Tabula Medica",
            "publisher": { "@id": "https://tabulamedica.health/#org" },
            "inLanguage": "en-US",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://tabulamedica.health/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://tabulamedica.health/#app",
            "name": "Tabula Medica",
            "alternateName": "Tabula Medica PHR",
            "applicationCategory": "HealthApplication",
            "applicationSubCategory": "Personal Health Record",
            "operatingSystem": "Web, iOS, Android",
            "url": "https://tabulamedica.health/",
            "downloadUrl": "https://apps.apple.com/app/tabula-medica/id6758421617",
            "installUrl": "https://apps.apple.com/app/tabula-medica/id6758421617",
            "publisher": { "@id": "https://tabulamedica.health/#org" },
            "inLanguage": ["en","es","zh","fr","de","ar","pt","hi","ja","ko","ru","vi","tl"],
            "offers": [
              {
                "@type": "Offer",
                "name": "Free",
                "price": "0",
                "priceCurrency": "USD",
                "category": "Free",
                "description": "Symptom checker, drug savings, find free care, one connected health source"
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "priceCurrency": "USD",
                "category": "Subscription",
                "description": "Unlimited source connections, AI health insights, medication alerts, family caregiving"
              },
              {
                "@type": "Offer",
                "name": "Concierge",
                "priceCurrency": "USD",
                "category": "Subscription",
                "description": "Everything in Pro plus concierge record retrieval, priority support, annual health review"
              }
            ],
            "featureList": [
              "Unified health timeline across every connected EHR",
              "SMART on FHIR connection to 30,000+ US health systems",
              "TEFCA Trusted Exchange Framework integration",
              "Patient-held encryption with zero-knowledge key model",
              "HIPAA-compliant with executed GCP BAA",
              "Family caregiver portal with minor and senior coverage",
              "Plain-English AI explanations of labs, diagnoses, and medications",
              "Real-time medication interaction alerts",
              "Symptom triage with deterministic red-flag rules",
              "52-language support with full RTL rendering",
              "GDPR and CCPA self-serve data subject request dashboards",
              "Biometric authentication (Face ID, Touch ID)",
              "Apple HealthKit integration on iOS"
            ],
            "audience": {
              "@type": "PeopleAudience",
              "audienceType": "Patients, caregivers, uninsured individuals, underserved communities"
            },
            "potentialAction": [
              {
                "@type": "ViewAction",
                "name": "Open Health Timeline",
                "description": "View your complete chronological health record across every connected source",
                "target": [
                  "https://tabulamedica.health/timeline",
                  "tabulamedica://timeline"
                ]
              },
              {
                "@type": "ViewAction",
                "name": "Symptom Checker",
                "description": "Check symptoms with deterministic red-flag triage and AI guidance",
                "target": [
                  "https://tabulamedica.health/symptom-checker",
                  "tabulamedica://symptom-checker"
                ]
              },
              {
                "@type": "ViewAction",
                "name": "Medication Safety Check",
                "description": "Scan your current medications for dangerous interactions and savings opportunities",
                "target": [
                  "https://tabulamedica.health/medications",
                  "tabulamedica://medications"
                ]
              },
              {
                "@type": "ViewAction",
                "name": "Find Free Care Near You",
                "description": "Locate federally qualified health centers, free clinics, and charity care in your area",
                "target": [
                  "https://tabulamedica.health/find-care",
                  "tabulamedica://find-care"
                ]
              },
              {
                "@type": "ViewAction",
                "name": "Connect a Health Source",
                "description": "Link your records from hospitals, clinics, labs, and pharmacies via SMART on FHIR",
                "target": [
                  "https://tabulamedica.health/connect",
                  "tabulamedica://connect-source"
                ]
              }
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://tabulamedica.health/faq#faqpage",
            "url": "https://tabulamedica.health/faq",
            "name": "Tabula Medica FAQ",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is Tabula Medica HIPAA compliant?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Tabula Medica is HIPAA-compliant with executed Business Associate Agreements (BAAs) with all cloud infrastructure providers (Google Cloud Platform). All PHI is encrypted with AES-256-GCM at rest and TLS 1.3 in transit, stored exclusively in BAA-covered GCP services."
                }
              },
              {
                "@type": "Question",
                "name": "How does Tabula Medica connect to my doctor's records?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tabula Medica uses SMART on FHIR and the national TEFCA Trusted Exchange Framework to connect to 30,000+ US hospitals, clinics, and health systems — including Epic, eClinicalWorks, and Cerner — with your consent. No portal passwords are required."
                }
              },
              {
                "@type": "Question",
                "name": "Is Tabula Medica free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tabula Medica offers free tools including a symptom checker, drug savings finder, free-care locator, and provider directory — all with no account required. A free account tier allows connecting one health source and viewing your basic timeline. Pro and Concierge subscription tiers unlock unlimited connections and advanced AI features."
                }
              },
              {
                "@type": "Question",
                "name": "What languages does Tabula Medica support?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tabula Medica supports 52 languages with full RTL rendering, including Arabic, Spanish, Chinese (Simplified and Traditional), French, German, Hindi, Japanese, Korean, Portuguese, Russian, Tagalog, Vietnamese, and more."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!--
      Plausible Analytics — cookieless, GDPR/CCPA/PECR compliant by design,
      so it can load before any consent banner. Only fires on production
      hostnames; localhost / *.replit.dev / *.replit.app are filtered out
      by the data-exclude attribute below.
    -->
    <script
      defer
      data-domain="tabulamedica.health"
      data-exclude="/admin/**,/dashboard/**,/patient/**,/provider/**,/clinician/**,/settings/**,/onboarding/**,/consent,/auth/**"
      src="https://plausible.io/js/script.outbound-links.js"
    ></script>

    <!--
      Usercentrics Consent Management Platform — loads only when the build
      provides a settings ID via VITE_USERCENTRICS_SETTINGS_ID. The CMP
      itself decides which consent-gated vendors (ads, marketing, embedded
      media) are allowed to fire after the user's response. Plausible is
      not gated through it because Plausible is cookieless and lawful
      under GDPR Article 6(1)(f) without consent.
    -->
    <script>
      (function () {
        var SID = "%VITE_USERCENTRICS_SETTINGS_ID%";
        if (!SID || SID.indexOf("VITE_USERCENTRICS") !== -1) return;
        var s = document.createElement("script");
        s.id = "usercentrics-cmp";
        s.async = true;
        s.src = "https://app.usercentrics.eu/browser-ui/latest/loader.js";
        s.setAttribute("data-settings-id", SID);
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding:24px;font-family:system-ui;background:#fee2e2;color:#991b1b">
          This app requires JavaScript. Please enable it.
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered:", registration.scope);
            })
            .catch((error) => {
              console.log("SW registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
