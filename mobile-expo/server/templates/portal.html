async function loadMedSummary() {
  const id = document.getElementById('med-patient-id').value.trim();
  if (!id) return;
  const container = document.getElementById('med-summary-result');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const data = await apiFetch('/medications/provider/patient-summary/' + id);
    let html = '';

    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px">';
    html += '<div style="background:var(--bg-secondary);padding:14px;border-radius:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:var(--primary)">' + data.medicationCount + '</div><div style="font-size:11px;color:var(--text-secondary)">Active Meds</div></div>';
    html += '<div style="background:var(--bg-secondary);padding:14px;border-radius:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:' + (data.overallAdherence.rate >= 80 ? 'var(--success)' : data.overallAdherence.rate >= 60 ? 'var(--warning)' : 'var(--danger)') + '">' + data.overallAdherence.rate + '%</div><div style="font-size:11px;color:var(--text-secondary)">Overall Adherence</div></div>';
    html += '<div style="background:var(--bg-secondary);padding:14px;border-radius:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:' + (data.drugInteractions.length > 0 ? 'var(--danger)' : 'var(--success)') + '">' + data.drugInteractions.length + '</div><div style="font-size:11px;color:var(--text-secondary)">Interactions</div></div>';
    html += '<div style="background:var(--bg-secondary);padding:14px;border-radius:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:' + (data.polypharmacyRisk === 'high' ? 'var(--danger)' : data.polypharmacyRisk === 'moderate' ? 'var(--warning)' : 'var(--success)') + '">' + data.polypharmacyRisk.charAt(0).toUpperCase() + data.polypharmacyRisk.slice(1) + '</div><div style="font-size:11px;color:var(--text-secondary)">Polypharmacy Risk</div></div>';
    html += '</div>';

    if (data.activeMedications.length > 0) {
      html += '<h4 style="margin:16px 0 8px;font-size:14px">Active Medications</h4>';
      html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
      html += '<tr style="background:var(--bg-secondary)"><th style="padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">Medication</th><th style="padding:8px;text-align:left;border-bottom:1px solid var(--border)">Dosage</th><th style="padding:8px;text-align:center;border-bottom:1px solid var(--border)">90-Day</th><th style="padding:8px;text-align:center;border-bottom:1px solid var(--border)">7-Day</th><th style="padding:8px;text-align:center;border-bottom:1px solid var(--border)">Trend</th><th style="padding:8px;text-align:center;border-bottom:1px solid var(--border)">Missed</th></tr>';
      data.activeMedications.forEach(m => {
        const rateColor = m.adherenceRate90Day >= 80 ? 'var(--success)' : m.adherenceRate90Day >= 60 ? 'var(--warning)' : 'var(--danger)';
        const trendIcon = m.trend === 'improving' ? '&#9650;' : m.trend === 'declining' ? '&#9660;' : '&#8212;';
        const trendColor = m.trend === 'improving' ? 'var(--success)' : m.trend === 'declining' ? 'var(--danger)' : 'var(--text-secondary)';
        html += '<tr style="border-bottom:1px solid var(--border)">';
        html += '<td style="padding:8px 10px;font-weight:600">' + escapeHtml(m.medicationName) + '</td>';
        html += '<td style="padding:8px;color:var(--text-secondary)">' + escapeHtml(m.dosage || '-') + ' / ' + escapeHtml(m.frequency) + '</td>';
        html += '<td style="padding:8px;text-align:center;font-weight:600;color:' + rateColor + '">' + m.adherenceRate90Day + '%</td>';
        html += '<td style="padding:8px;text-align:center">' + m.adherenceRate7Day + '%</td>';
        html += '<td style="padding:8px;text-align:center;color:' + trendColor + '">' + trendIcon + '</td>';
        html += '<td style="padding:8px;text-align:center;color:var(--danger)">' + m.missed + '</td>';
        html += '</tr>';
      });
      html += '</table></div>';
    } else {
      html += '<div class="empty-state" style="padding:20px"><p>No active medications found for this patient.</p></div>';
    }

    if (data.drugInteractions.length > 0) {
      html += '<h4 style="margin:16px 0 8px;font-size:14px;color:var(--danger)">Drug Interactions Detected</h4>';
      data.drugInteractions.forEach(i => {
        const sevColor = i.severity === 'high' ? 'var(--danger)' : 'var(--warning)';
        html += '<div style="background:' + (i.severity === 'high' ? 'rgba(239,68,68,0.08)' : 'rgba(245,158,11,0.08)') + ';border-left:3px solid ' + sevColor + ';padding:10px 14px;border-radius:6px;margin-bottom:8px">';
        html += '<div style="font-weight:600;font-size:13px"><span style="color:' + sevColor + '">[' + i.severity.toUpperCase() + ']</span> ' + escapeHtml(i.drug1) + ' + ' + escapeHtml(i.drug2) + '</div>';
        html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">' + escapeHtml(i.description) + '</div></div>';
      });
    }

    if (data.discontinuedMedications.length > 0) {
      html += '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--text-secondary)">Discontinued Medications (' + data.discontinuedMedications.length + ')</summary>';
      html += '<div style="margin-top:8px">';
      data.discontinuedMedications.forEach(m => {
        html += '<div style="padding:6px 0;font-size:12px;color:var(--text-secondary);border-bottom:1px solid var(--border)">' + escapeHtml(m.medicationName) + ' ' + escapeHtml(m.dosage || '') + ' <span style="opacity:0.7">(ended ' + formatShortDate(m.endDate) + ')</span></div>';
      });
      html += '</div></details>';
    }

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="empty-state"><p>Error: ' + escapeHtml(e.message) + '</p></div>';
  }
}

async function checkInteraction() {
  const patientId = document.getElementById('interaction-patient-id').value.trim();
  const newMed = document.getElementById('interaction-new-med').value.trim();
  if (!patientId || !newMed) return;
  const container = document.getElementById('interaction-result');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const data = await apiFetch('/medications/check-interaction?patientId=' + encodeURIComponent(patientId), {
      method: 'POST',
      body: JSON.stringify({ newMedication: newMed }),
    });
    let html = '';

    if (data.hasInteractions) {
      html += '<div style="background:rgba(239,68,68,0.08);padding:14px;border-radius:10px;margin-bottom:12px"><div style="font-size:15px;font-weight:700;color:var(--danger);margin-bottom:8px">Interactions Found (' + data.interactions.length + ')</div>';
      data.interactions.forEach(i => {
        const sevColor = i.severity === 'high' ? 'var(--danger)' : 'var(--warning)';
        html += '<div style="border-left:3px solid ' + sevColor + ';padding:8px 12px;margin-bottom:8px;background:rgba(255,255,255,0.05);border-radius:0 8px 8px 0">';
        html += '<div style="font-weight:600;font-size:13px"><span style="color:' + sevColor + '">[' + i.severity.toUpperCase() + ']</span> ' + escapeHtml(i.existingMedication) + ' + ' + escapeHtml(i.newMedication) + '</div>';
        html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">' + escapeHtml(i.description) + '</div></div>';
      });
      html += '</div>';
    } else {
      html += '<div style="background:rgba(16,185,129,0.08);padding:14px;border-radius:10px;margin-bottom:12px"><div style="font-size:14px;font-weight:600;color:var(--success)">No Known Interactions Found</div><div style="font-size:12px;color:var(--text-secondary);margin-top:4px">' + escapeHtml(newMed) + ' does not have known interactions with the patient\'s ' + data.currentMedicationCount + ' current medication(s) in our database.</div></div>';
    }

    if (data.sideEffects) {
      html += '<div style="margin-top:12px">';
      html += '<h4 style="font-size:14px;margin-bottom:8px">Side Effect Profile: ' + escapeHtml(newMed) + '</h4>';
      if (data.sideEffects.common.length > 0) {
        html += '<div style="margin-bottom:8px"><span style="font-size:12px;font-weight:600;color:var(--text-secondary)">Common:</span> <span style="font-size:12px">' + data.sideEffects.common.map(s => escapeHtml(s)).join(', ') + '</span></div>';
      }
      if (data.sideEffects.serious.length > 0) {
        html += '<div style="margin-bottom:8px"><span style="font-size:12px;font-weight:600;color:var(--danger)">Serious:</span> <span style="font-size:12px">' + data.sideEffects.serious.map(s => escapeHtml(s)).join(', ') + '</span></div>';
      }
      if (data.sideEffects.watchFor.length > 0) {
        html += '<div><span style="font-size:12px;font-weight:600;color:var(--warning)">Watch For:</span> <span style="font-size:12px">' + data.sideEffects.watchFor.map(s => escapeHtml(s)).join(', ') + '</span></div>';
      }
      html += '</div>';
    }

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="empty-state"><p>Error: ' + escapeHtml(e.message) + '</p></div>';
  }
}

let _currentAITab = 'review';
function switchAITab(tab) {
  _currentAITab = tab;
  document.querySelectorAll('.ai-tab-panel').forEach(p => p.style.display = 'none');
  const panel = document.getElementById('ai-tab-' + tab);
  if (panel) panel.style.display = 'block';
  const btns = document.querySelectorAll('[onclick^="switchAITab"]');
  btns.forEach(b => { b.classList.remove('btn-primary'); });
  btns.forEach(b => { if (b.getAttribute('onclick').includes("'" + tab + "'")) b.classList.add('btn-primary'); });
}

function getSelectedPatientId() {
  return document.getElementById('ai-patient-id')?.value || document.getElementById('ai-patient-select')?.value || '';
}

async function loadAlertsFullView() {
  const container = document.getElementById('ai-alerts-full');
  if (!container) return;
  try {
    const data = await apiFetch('/ai-assistant/alerts');
    if (data.alerts.length === 0) {
      container.innerHTML = '<div class="empty-state"><h3>No Active Alerts</h3><p>All patients appear to be within normal parameters.</p></div>';
      return;
    }
    container.innerHTML = data.alerts.map(a => `
      <div class="ai-alert-card alert-${a.type}">
        <div class="ai-alert-header">
          <div class="ai-alert-icon ${a.type}">${a.type === 'critical' ? '!' : a.type === 'warning' ? '!' : 'i'}</div>
          <div class="ai-alert-message">${escapeHtml(a.message)}</div>
          <div class="ai-alert-category">${escapeHtml(a.category || '').replace(/_/g, ' ')}</div>
        </div>
        ${a.patientName ? `<div class="ai-alert-patient" onclick="document.getElementById('ai-patient-id').value='${a.patientId}';document.getElementById('ai-patient-select').value='${a.patientId}';runAISummary();switchAITab('summary')">${escapeHtml(a.patientName)} - View Summary</div>` : ''}
      </div>`).join('');
  } catch (err) {
    container.innerHTML = '<div class="alert alert-error">' + escapeHtml(err.message) + '</div>';
  }
}

async function runAISummary() {
  const id = getSelectedPatientId();
  const container = document.getElementById('ai-summary-content');
  if (!container) return;
  if (!id) { container.innerHTML = '<div class="alert alert-info">Please select a patient first.</div>'; switchAITab('summary'); return; }
  switchAITab('summary');
  container.innerHTML = '<div style="text-align:center;padding:40px"><div class="spinner"></div><p style="color:var(--text-light);font-size:13px;margin-top:12px">Generating comprehensive patient summary...</p><p style="color:var(--text-light);font-size:11px">Analyzing records, medications, vitals, labs, and journal entries.</p></div>';
  try {
    const data = await apiFetch(`/ai-assistant/summarize-patient/${id}`, { method: 'POST' });
    const s = data.summary || {};
    const dp = data.dataPoints || {};
    let html = '';

    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:8px">';
    html += '<div><div style="font-size:16px;font-weight:700;color:var(--text)">' + escapeHtml(data.patient.name) + '</div>';
    html += '<div style="font-size:11px;color:var(--text-light);margin-top:2px">Generated ' + formatShortDate(data.generatedAt) + '</div></div>';
    html += '<button onclick="printSummary()" class="btn" style="font-size:11px;padding:6px 12px">Print Summary</button></div>';

    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:16px">';
    html += statCard(dp.totalRecords || 0, 'Records', 'var(--text)');
    html += statCard(dp.conditions || 0, 'Conditions', 'var(--primary)');
    html += statCard(dp.activeMedications || 0, 'Meds', 'var(--success)');
    html += statCard(dp.vitals || 0, 'Vitals', 'var(--warning)');
    html += statCard(dp.labs || 0, 'Labs', 'var(--info, var(--primary))');
    html += statCard(dp.appointments || 0, 'Appts', 'var(--text-light)');
    html += '</div>';

    if (s.patientOverview) {
      html += '<div style="background:linear-gradient(135deg,#EFF6FF,#F0FDF4);border:1px solid #BFDBFE;border-radius:12px;padding:14px;margin-bottom:16px">';
      html += '<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px">Patient Overview</div>';
      html += '<div style="font-size:13px;color:var(--text);line-height:1.5">' + escapeHtml(s.patientOverview) + '</div></div>';
    }

    const sections = [
      { key: 'activeProblemList', title: 'Active Problem List', isList: true },
      { key: 'medicationSummary', title: 'Medication Summary' },
      { key: 'vitalsSummary', title: 'Vitals Summary' },
      { key: 'labsSummary', title: 'Labs Summary' },
      { key: 'riskAssessment', title: 'Risk Assessment' },
      { key: 'recentActivity', title: 'Recent Activity' },
    ];

    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px">';
    sections.forEach(sec => {
      if (s[sec.key]) {
        html += '<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
        html += '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px">' + sec.title + '</div>';
        if (sec.isList && Array.isArray(s[sec.key])) {
          html += '<ul style="margin:0;padding-left:16px">' + s[sec.key].map(item => '<li style="font-size:12px;margin-bottom:2px">' + escapeHtml(item) + '</li>').join('') + '</ul>';
        } else {
          html += '<div style="font-size:12px;color:var(--text);line-height:1.5">' + escapeHtml(s[sec.key]) + '</div>';
        }
        html += '</div>';
      }
    });
    html += '</div>';

    if (s.clinicalConcerns && s.clinicalConcerns.length > 0) {
      html += '<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--danger)">Clinical Concerns</div>';
      s.clinicalConcerns.forEach(c => {
        const concern = typeof c === 'string' ? c : c.concern || JSON.stringify(c);
        const urgency = typeof c === 'object' ? c.urgency : '';
        const recommendation = typeof c === 'object' ? c.recommendation : '';
        const urgColor = urgency === 'high' || urgency === 'urgent' ? 'var(--danger)' : urgency === 'medium' ? 'var(--warning)' : 'var(--success)';
        html += '<div style="padding:10px 14px;border-left:3px solid ' + urgColor + ';background:var(--bg);border-radius:0 8px 8px 0;margin-bottom:6px">';
        html += '<div style="display:flex;align-items:center;gap:8px">';
        if (urgency) html += '<span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:' + urgColor + '15;color:' + urgColor + ';text-transform:uppercase">' + escapeHtml(urgency) + '</span>';
        html += '<span style="font-size:12px;font-weight:600">' + escapeHtml(concern) + '</span></div>';
        if (recommendation) html += '<div style="font-size:11px;color:var(--text-light);margin-top:4px">' + escapeHtml(recommendation) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    if (s.recommendedActions && s.recommendedActions.length > 0) {
      html += '<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:8px">Recommended Actions</div>';
      html += '<ul style="margin:0;padding-left:16px">' + s.recommendedActions.map(a => '<li style="font-size:12px;margin-bottom:4px">' + escapeHtml(typeof a === 'string' ? a : JSON.stringify(a)) + '</li>').join('') + '</ul></div>';
    }

    html += '<div style="font-size:10px;color:var(--text-light);text-align:center;padding:8px;background:var(--bg);border-radius:8px">AI-generated summary for clinical decision support. Review all data and apply clinical judgment before making care decisions.</div>';

    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<div class="alert alert-error">' + escapeHtml(err.message) + '</div>';
  }
}

function printSummary() {
  const content = document.getElementById('ai-summary-content');
  if (!content) return;
  const w = window.open('', '_blank');
  w.document.write('<html><head><title>Patient Summary</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:20px;font-size:13px;line-height:1.6;color:#333} h1{font-size:18px} @media print{body{margin:0}}</style></head><body>');
  w.document.write(content.innerHTML);
  w.document.write('</body></html>');
  w.document.close();
  w.print();
}

let _ddxSymptoms = [];

function addSymptom() {
  const input = document.getElementById('symptom-input');
  const val = input?.value?.trim();
  if (!val) return;
  addSymptomDirect(val);
  input.value = '';
}

function addSymptomDirect(symptom) {
  if (_ddxSymptoms.includes(symptom)) return;
  _ddxSymptoms.push(symptom);
  renderSymptomTags();
}

function removeSymptom(idx) {
  _ddxSymptoms.splice(idx, 1);
  renderSymptomTags();
}

function renderSymptomTags() {
  const container = document.getElementById('symptom-tags');
  if (!container) return;
  container.innerHTML = _ddxSymptoms.map((s, i) => `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--primary-light);border:1px solid var(--primary);border-radius:16px;font-size:12px;color:var(--primary)">${escapeHtml(s)}<span onclick="removeSymptom(${i})" style="cursor:pointer;font-weight:700;color:var(--danger);margin-left:2px">x</span></span>`).join('');
}

async function draftReferralLetter() {
  const id = getSelectedPatientId();
  const container = document.getElementById('referral-letter-content');
  const btn = document.getElementById('referral-generate-btn');
  const copyBtn = document.getElementById('copy-referral-btn');
  if (!container) return;
  if (!id) { showToast('Please select a patient first', 'error'); return; }
  const reason = document.getElementById('referral-reason')?.value?.trim();
  if (!reason) { showToast('Please enter a reason for referral', 'error'); return; }

  if (btn) { btn.disabled = true; btn.textContent = 'Drafting...'; }
  container.innerHTML = '<div style="text-align:center;padding:40px"><div class="spinner"></div><p style="color:var(--text-light);font-size:13px;margin-top:12px">AI is drafting the referral letter...</p></div>';

  try {
    const data = await apiFetch(`/ai-assistant/draft-referral/${id}`, {
      method: 'POST',
      body: JSON.stringify({
        referralReason: reason,
        specialtyTarget: document.getElementById('referral-specialty')?.value,
        urgency: document.getElementById('referral-urgency')?.value,
        additionalNotes: document.getElementById('referral-notes')?.value?.trim(),
      }),
    });

    const r = data.referral || {};
    let html = '';

    if (r.summary) {
      html += '<div style="background:var(--primary-light);border:1px solid var(--primary);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--primary)">' + escapeHtml(r.summary) + '</div>';
    }

    if (r.urgencyJustification) {
      const urgVal = data.parameters?.urgency || 'routine';
      const urgColor = urgVal === 'emergent' ? 'var(--danger)' : urgVal === 'urgent' ? 'var(--warning)' : 'var(--success)';
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;background:' + urgColor + '15;color:' + urgColor + ';text-transform:uppercase">' + escapeHtml(urgVal) + '</span><span style="font-size:12px;color:var(--text-light)">' + escapeHtml(r.urgencyJustification) + '</span></div>';
    }

    html += '<div id="referral-letter-text" style="background:var(--white);border:1px solid var(--border);border-radius:8px;padding:20px;font-size:13px;line-height:1.7;white-space:pre-wrap;font-family:\'Georgia\',serif;color:var(--text)">' + escapeHtml(r.letterText || 'Letter generation failed.') + '</div>';

    if (r.keyFindings && r.keyFindings.length > 0) {
      html += '<div style="margin-top:12px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">Key Clinical Findings</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:4px">' + r.keyFindings.map(f => '<span style="font-size:11px;padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px">' + escapeHtml(f) + '</span>').join('') + '</div></div>';
    }

    if (r.recommendedTests && r.recommendedTests.length > 0) {
      html += '<div style="margin-top:12px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">Recommended Pre-Referral Tests</div>';
      html += '<ul style="margin:0;padding-left:16px">' + r.recommendedTests.map(t => '<li style="font-size:12px;margin-bottom:2px">' + escapeHtml(typeof t === 'string' ? t : t.test || JSON.stringify(t)) + '</li>').join('') + '</ul></div>';
    }

    html += '<div style="margin-top:12px;font-size:10px;color:var(--text-light);text-align:center;padding:8px;background:var(--bg);border-radius:6px">AI-drafted letter. Review, edit, and finalize before sending to the specialist.</div>';

    window._lastReferralText = r.letterText || '';
    container.innerHTML = html;
    if (copyBtn) copyBtn.style.display = 'inline-block';
  } catch (err) {
    container.innerHTML = '<div class="alert alert-error">' + escapeHtml(err.message) + '</div>';
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = ICONS.aiassistant + ' Draft Referral Letter'; }
  }
}

function copyReferralLetter() {
  if (window._lastReferralText) {
    navigator.clipboard.writeText(window._lastReferralText).then(() => showToast('Referral letter copied to clipboard', 'success')).catch(() => showToast('Failed to copy', 'error'));
  }
}

async function runDifferentialDiagnosis() {
  if (_ddxSymptoms.length === 0) { showToast('Please add at least one symptom', 'error'); return; }
  const container = document.getElementById('ddx-results');
  const btn = document.getElementById('ddx-generate-btn');
  if (!container) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Analyzing...'; }
  container.innerHTML = '<div style="text-align:center;padding:40px"><div class="spinner"></div><p style="color:var(--text-light);font-size:13px;margin-top:12px">Running differential diagnosis analysis...</p><p style="color:var(--text-light);font-size:11px">Correlating symptoms with patient history and clinical patterns.</p></div>';

  try {
    const patientId = getSelectedPatientId() || null;
    const data = await apiFetch('/ai-assistant/differential-diagnosis', {
      method: 'POST',
      body: JSON.stringify({
        patientId,
        symptoms: _ddxSymptoms,
        duration: document.getElementById('ddx-duration')?.value,
        severity: document.getElementById('ddx-severity')?.value,
        additionalContext: document.getElementById('ddx-context')?.value?.trim(),
      }),
    });

    const diff = data.differential || {};
    let html = '';

    if (data.patientContext) {
      html += '<div style="background:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;display:flex;align-items:center;gap:8px"><strong>' + escapeHtml(data.patientContext.name) + '</strong><span style="color:var(--text-light)">' + (data.patientContext.existingConditions || []).length + ' existing conditions | ' + (data.patientContext.medicationCount || 0) + ' medications</span></div>';
    }

    html += '<div style="margin-bottom:12px;font-size:12px;color:var(--text-light)"><strong>Symptoms:</strong> ' + _ddxSymptoms.map(s => '<span style="padding:2px 6px;background:var(--primary-light);border-radius:4px;font-size:11px">' + escapeHtml(s) + '</span>').join(' ') + ' | <strong>Duration:</strong> ' + escapeHtml(data.duration || 'N/A') + ' | <strong>Severity:</strong> ' + escapeHtml(data.severity || 'N/A') + '</div>';

    if (diff.emergencyFlags && diff.emergencyFlags.length > 0) {
      html += '<div style="background:#FEE2E2;border:1px solid #FECACA;border-radius:8px;padding:12px;margin-bottom:12px">';
      html += '<div style="font-size:12px;font-weight:700;color:#991B1B;margin-bottom:6px">Emergency Flags</div>';
      diff.emergencyFlags.forEach(f => {
        html += '<div style="font-size:12px;color:#991B1B;margin-bottom:2px;padding-left:12px;border-left:2px solid #DC2626">' + escapeHtml(f) + '</div>';
      });
      html += '</div>';
    }

    if (diff.criticalConsiderations && diff.criticalConsiderations.length > 0) {
      html += '<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:12px;margin-bottom:12px">';
      html += '<div style="font-size:12px;font-weight:700;color:#92400E;margin-bottom:6px">Critical Considerations</div>';
      diff.criticalConsiderations.forEach(c => {
        html += '<div style="font-size:12px;color:#92400E;margin-bottom:2px">' + escapeHtml(c) + '</div>';
      });
      html += '</div>';
    }

    if (diff.differentialDiagnoses && diff.differentialDiagnoses.length > 0) {
      html += '<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:10px">Differential Diagnoses</div>';
      diff.differentialDiagnoses.forEach((dx, i) => {
        const likeColor = dx.likelihood === 'high' ? 'var(--danger)' : dx.likelihood === 'moderate' ? 'var(--warning)' : 'var(--success)';
        html += '<div style="padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px">';
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
        html += '<span style="font-size:16px;font-weight:700;color:var(--text-light);min-width:24px">' + (i + 1) + '</span>';
        html += '<span style="font-size:14px;font-weight:700;color:var(--text)">' + escapeHtml(dx.diagnosis) + '</span>';
        html += '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:' + likeColor + '15;color:' + likeColor + ';text-transform:uppercase;margin-left:auto">' + escapeHtml(dx.likelihood) + '</span>';
        if (dx.icd10) html += '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--text-light)">' + escapeHtml(dx.icd10) + '</span>';
        html += '</div>';
        if (dx.reasoning) html += '<div style="font-size:12px;color:var(--text);margin-bottom:6px;padding-left:32px">' + escapeHtml(dx.reasoning) + '</div>';
        if (dx.keyFeatures && dx.keyFeatures.length > 0) {
          html += '<div style="padding-left:32px;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px">';
          dx.keyFeatures.forEach(f => { html += '<span style="font-size:10px;padding:2px 6px;background:var(--primary-light);border-radius:4px">' + escapeHtml(f) + '</span>'; });
          html += '</div>';
        }
        if (dx.redFlags && dx.redFlags.length > 0) {
          html += '<div style="padding-left:32px;display:flex;flex-wrap:wrap;gap:4px">';
          dx.redFlags.forEach(f => { html += '<span style="font-size:10px;padding:2px 6px;background:#FEE2E2;color:#991B1B;border-radius:4px">' + escapeHtml(f) + '</span>'; });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    if (diff.recommendedWorkup && diff.recommendedWorkup.length > 0) {
      html += '<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:8px">Recommended Workup</div>';
      html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
      html += '<tr style="background:var(--bg)"><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">Test</th><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">Rationale</th><th style="padding:8px;text-align:center;border-bottom:2px solid var(--border)">Priority</th></tr>';
      diff.recommendedWorkup.forEach(w => {
        const test = typeof w === 'string' ? w : w.test || JSON.stringify(w);
        const rationale = typeof w === 'object' ? (w.rationale || '') : '';
        const priority = typeof w === 'object' ? (w.priority || '') : '';
        const prioColor = priority === 'immediate' ? 'var(--danger)' : priority === 'routine' ? 'var(--success)' : 'var(--text-light)';
        html += '<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px;font-weight:600">' + escapeHtml(test) + '</td><td style="padding:8px;color:var(--text-light)">' + escapeHtml(rationale) + '</td><td style="padding:8px;text-align:center"><span style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:' + prioColor + '15;color:' + prioColor + '">' + escapeHtml(priority) + '</span></td></tr>';
      });
      html += '</table></div></div>';
    }

    if (diff.clinicalPearls && diff.clinicalPearls.length > 0) {
      html += '<div style="margin-bottom:12px;padding:12px;background:linear-gradient(135deg,#EFF6FF,#FEF3C7);border:1px solid #BFDBFE;border-radius:8px">';
      html += '<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px">Clinical Pearls</div>';
      diff.clinicalPearls.forEach(p => {
        html += '<div style="font-size:12px;margin-bottom:4px;padding-left:12px;border-left:2px solid var(--primary)">' + escapeHtml(p) + '</div>';
      });
      html += '</div>';
    }

    html += '<div style="font-size:10px;color:var(--text-light);text-align:center;padding:10px;background:var(--bg);border-radius:8px">' + escapeHtml(data.disclaimer || 'AI-generated differential diagnosis for clinical decision support only.') + '</div>';

    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<div class="alert alert-error">' + escapeHtml(err.message) + '</div>';
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = ICONS.insights + ' Generate Differential Diagnosis'; }
  }
}

async function loadSystemAlerts() {

    const data = await apiFetch('/ai-assistant/alerts');

      <div class="ai-stat-mini"><div class="stat-value">${data.totalAlerts}</div><div class="stat-label">Total Alerts</div></div>
      <div class="ai-stat-mini"><div class="stat-value" style="color:var(--danger)">${data.criticalCount}</div><div class="stat-label">Critical</div></div>
      <div class="ai-stat-mini"><div class="stat-value" style="color:var(--warning)">${data.warningCount}</div><div class="stat-label">Warnings</div></div>`;

    if (data.alerts.length === 0) {
      container.innerHTML = '<div class="empty-state"><h3>No Active Alerts</h3><p>All patients appear to be within normal parameters.</p></div>';

    container.innerHTML = data.alerts.map(a => `
      <div class="ai-alert-card alert-${a.type}">

async function runPatientReview() {
  const id = getSelectedPatientId();
  const container = document.getElementById('ai-review-content');
  switchAITab('review');
  if (!container) return;
  if (!id) { container.innerHTML = '<div class="alert alert-info">Please enter a patient ID.</div>'; return; }
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const data = await apiFetch(`/ai-assistant/patient-review/${id}`);

    let alertsHtml = '';
    if (data.alerts.length > 0) {
      alertsHtml = `<div style="margin-bottom:16px"><div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text)">Alerts (${data.alerts.length})</div>
        ${data.alerts.map(a => `<div class="ai-alert-card alert-${a.type}">
          <div class="ai-alert-header">
            <div class="ai-alert-icon ${a.type}">${a.type === 'critical' ? '!' : '!'}</div>
            <div class="ai-alert-message">${escapeHtml(a.message)}</div>
          </div>
          ${a.date ? `<div style="font-size:11px;color:var(--text-light);margin-top:4px">${formatShortDate(a.date)}</div>` : ''}
        </div>`).join('')}</div>`;
    } else {
      alertsHtml = '<div class="alert alert-success" style="margin-bottom:16px">No active alerts for this patient.</div>';
    }

    let adherenceHtml = '';
    if (data.adherenceStats.rate !== null) {
      const rateColor = data.adherenceStats.rate >= 80 ? 'var(--success)' : data.adherenceStats.rate >= 60 ? 'var(--warning)' : 'var(--danger)';
      adherenceHtml = `<div style="margin-bottom:16px"><div style="font-weight:600;font-size:13px;margin-bottom:8px">Medication Adherence (30-day)</div>
        <div class="ai-stats-row">
          <div class="ai-stat-mini"><div class="stat-value" style="color:${rateColor}">${data.adherenceStats.rate}%</div><div class="stat-label">Adherence Rate</div></div>
          <div class="ai-stat-mini"><div class="stat-value">${data.adherenceStats.activeMedications}</div><div class="stat-label">Active Meds</div></div>
          <div class="ai-stat-mini"><div class="stat-value">${data.adherenceStats.takenDoses}</div><div class="stat-label">Doses Taken</div></div>
          <div class="ai-stat-mini"><div class="stat-value" style="color:var(--danger)">${data.adherenceStats.missedDoses}</div><div class="stat-label">Missed</div></div>
        </div></div>`;
    }

    let journalHtml = '';
    if (data.journalSummary.totalEntries > 0) {
      journalHtml = `<div style="margin-bottom:16px"><div style="font-weight:600;font-size:13px;margin-bottom:8px">Health Journal Summary</div>
        <div class="ai-stats-row">
          <div class="ai-stat-mini"><div class="stat-value">${data.journalSummary.totalEntries}</div><div class="stat-label">Journal Entries</div></div>
          ${data.journalSummary.recentPainAvg !== null ? `<div class="ai-stat-mini"><div class="stat-value" style="color:${data.journalSummary.recentPainAvg >= 5 ? 'var(--danger)' : 'var(--text)'}">${data.journalSummary.recentPainAvg}/10</div><div class="stat-label">Avg Pain</div></div>` : ''}
          ${data.journalSummary.recentMoodAvg !== null ? `<div class="ai-stat-mini"><div class="stat-value">${data.journalSummary.recentMoodAvg}/4</div><div class="stat-label">Avg Mood</div></div>` : ''}
        </div>
        ${data.journalSummary.frequentSymptoms.length > 0 ? `<div style="margin-top:8px"><span style="font-size:12px;font-weight:600;color:var(--text-light)">Frequent symptoms:</span> ${data.journalSummary.frequentSymptoms.map(([s, c]) => `<span class="risk-factor-tag">${escapeHtml(s)} (${c}x)</span>`).join(' ')}</div>` : ''}</div>`;
    }

    let suggestionsHtml = '';
    if (data.suggestions.length > 0) {
      suggestionsHtml = `<div><div style="font-weight:600;font-size:13px;margin-bottom:8px">Recommended Actions</div>
        ${data.suggestions.map(s => `<div class="ai-suggestion">
          <div class="ai-suggestion-priority ${s.priority}"></div>
          <div style="flex:1">
            <div class="ai-suggestion-text">${escapeHtml(s.action)}</div>
            <div class="ai-suggestion-reason">${escapeHtml(s.reason)}</div>
          </div>
        </div>`).join('')}</div>`;
    }

    container.innerHTML = `
      <div style="margin-bottom:16px;padding:12px;background:var(--bg);border-radius:var(--radius-sm)">
        <div style="font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px">${escapeHtml(data.patient.name)}</div>
        <div style="font-size:12px;color:var(--text-light)">${escapeHtml(data.patient.email)} | ${data.recordsSummary.total} records | ${data.recordsSummary.vitals} vitals | ${data.recordsSummary.labs} labs</div>
      </div>

  }

async function runPredictiveAnalysis() {
  const id = getSelectedPatientId();
  const panel = document.getElementById('ai-predictions-panel');
  switchAITab('review');
  if (!panel) return;
  if (!id) { panel.innerHTML = '<div class="alert alert-info">Please enter a patient ID first.</div>'; return; }
  panel.innerHTML = '<div class="card"><div class="card-header"><div class="card-title">Predictive Risk Analysis</div></div><div class="spinner"></div><p style="text-align:center;font-size:13px;color:var(--text-light)">Running AI analysis... This may take a moment.</p></div>';
  try {
    const data = await apiFetch(`/ai-assistant/predict-risks/${id}`, { method: 'POST' });
    const analysis = data.analysis || {};
    const predictions = analysis.riskPredictions || [];
    const trends = analysis.trendAnalysis || {};

    let predictionsHtml = '';
    if (predictions.length > 0) {
      predictionsHtml = predictions.map(p => `
        <div class="risk-prediction-card risk-${p.riskLevel || 'low'}">
          <div class="risk-prediction-header">
            <div class="risk-prediction-area">${escapeHtml(p.riskArea || 'General')}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="badge badge-${p.riskLevel === 'critical' ? 'red' : p.riskLevel === 'high' ? 'red' : p.riskLevel === 'medium' ? 'amber' : 'green'}">${escapeHtml(p.riskLevel || 'low')}</span>
              ${p.confidence ? `<span style="font-size:11px;color:var(--text-light)">${Math.round(p.confidence * 100)}% confidence</span>` : ''}
            </div>
          </div>
          <div class="risk-prediction-desc">${escapeHtml(p.description || '')}</div>
          ${p.supportingFactors && p.supportingFactors.length > 0 ? `<div class="risk-factors">${p.supportingFactors.map(f => `<span class="risk-factor-tag">${escapeHtml(f)}</span>`).join('')}</div>` : ''}
          ${p.recommendedActions && p.recommendedActions.length > 0 ? `<div class="risk-actions">${p.recommendedActions.map(a => `<div class="risk-action">${escapeHtml(a)}</div>`).join('')}</div>` : ''}
          ${p.timeframe ? `<div style="margin-top:8px;font-size:11px;color:var(--text-light)">Timeframe: ${escapeHtml(p.timeframe)}</div>` : ''}
        </div>`).join('');
    } else {
      predictionsHtml = '<div class="empty-state"><h3>No risk predictions</h3><p>Insufficient data for risk prediction analysis.</p></div>';
    }

    let trendsHtml = '';
    if (trends.improving || trends.declining || trends.stable) {
      const trendItems = [];
      (trends.improving || []).forEach(t => trendItems.push(`<span class="trend-indicator trend-improving">+ ${escapeHtml(t)}</span>`));
      (trends.declining || []).forEach(t => trendItems.push(`<span class="trend-indicator trend-declining">- ${escapeHtml(t)}</span>`));
      (trends.stable || []).forEach(t => trendItems.push(`<span class="trend-indicator trend-stable">= ${escapeHtml(t)}</span>`));
      if (trendItems.length > 0) {
        trendsHtml = `<div class="card"><div class="card-header"><div class="card-title">Health Trends</div></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${trendItems.join('')}</div></div>`;
      }
    }

    panel.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Predictive Risk Analysis - ${escapeHtml(data.patient.name)}</div>
          <span style="font-size:11px;color:var(--text-light)">${data.note ? escapeHtml(data.note) : 'AI-powered analysis'} | ${formatDate(data.generatedAt)}</span>
        </div>
        ${analysis.prioritySummary ? `<div class="alert alert-info" style="margin-bottom:16px">${escapeHtml(analysis.prioritySummary)}</div>` : ''}
        <div class="ai-stats-row">
          <div class="ai-stat-mini"><div class="stat-value">${data.dataPoints.healthRecords}</div><div class="stat-label">Records Analyzed</div></div>
          <div class="ai-stat-mini"><div class="stat-value">${data.dataPoints.medications}</div><div class="stat-label">Medications</div></div>
          <div class="ai-stat-mini"><div class="stat-value">${data.dataPoints.journalEntries}</div><div class="stat-label">Journal Entries</div></div>
          <div class="ai-stat-mini"><div class="stat-value">${predictions.length}</div><div class="stat-label">Risk Predictions</div></div>
        </div>
        ${predictionsHtml}
      </div>
      ${trendsHtml}`;
  } catch (err) {
    panel.innerHTML = `<div class="alert alert-error">Failed to run predictive analysis: ${escapeHtml(err.message)}</div>`;
  }
}

async function renderInsights(params) {
  const content = document.getElementById('content-area');
  try {
    const summary = await apiFetch('/insights/summary');
    const riskMap = {};
    (summary.riskDistribution || []).forEach(r => { riskMap[r.riskLevel] = r.count; });
    const riskColors = { low: 'var(--success)', medium: 'var(--warning)', high: 'var(--danger)', critical: '#7C3AED' };

    content.innerHTML = `
      <div class="insight-summary">
        <div class="insight-card"><div class="stat-value">${summary.totalPredictions}</div><div class="stat-label">Total Predictions</div></div>
        ${Object.entries(riskMap).map(([level, cnt]) => `<div class="insight-card"><div class="stat-value" style="color:${riskColors[level] || 'var(--text)'}">${cnt}</div><div class="stat-label">${level.charAt(0).toUpperCase() + level.slice(1)} Risk</div></div>`).join('')}
      </div>
      ${(summary.predictionTypes || []).length > 0 ? `<div class="card"><div class="card-header"><div class="card-title">Prediction Types</div></div>
        <div class="bar-chart">${summary.predictionTypes.map(pt => {
          const maxPT = Math.max(1, ...summary.predictionTypes.map(x => Number(x.count)));
          const pct = Math.round((Number(pt.count) / maxPT) * 100);
          return `<div class="bar-row"><div class="bar-label">${escapeHtml(pt.type)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%">${pt.count}</div></div></div>`;
        }).join('')}</div></div>` : ''}
      <div class="card">
        <div class="card-header"><div class="card-title">Patient Insights Lookup</div></div>
        <div class="search-bar" style="margin-bottom:12px">
          <input class="form-input" id="insight-patient-id" placeholder="Enter Patient ID to view insights..." style="max-width:360px">
          <button class="btn btn-primary" onclick="loadPatientInsights()">View Insights</button>
        </div>
        <div id="patient-insights-content"></div>
      </div>
      ${(summary.recentPredictions || []).length > 0 ? `<div class="card"><div class="card-header"><div class="card-title">Recent Predictions</div></div>
        ${summary.recentPredictions.map(p => `<div class="prediction-card">
          <div class="prediction-header"><span class="prediction-type">${escapeHtml(p.predictionType || 'Prediction')}</span><span class="badge badge-${p.riskLevel === 'low' ? 'green' : p.riskLevel === 'medium' ? 'amber' : p.riskLevel === 'high' ? 'red' : 'purple'}">${escapeHtml(p.riskLevel || '-')}</span></div>
          <div class="prediction-details">${escapeHtml(p.description || '')}</div>
          ${p.confidence ? `<div class="risk-bar"><div class="risk-bar-fill" style="width:${Math.round(p.confidence * 100)}%;background:${riskColors[p.riskLevel] || 'var(--primary)'}"></div></div>` : ''}
        </div>`).join('')}</div>` : ''}`;
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">Failed to load insights: ${escapeHtml(err.message)}</div>`;
  }
}

          ${p.confidence ? `<div class="risk-bar"><div class="risk-bar-fill" style="width:${Math.round(p.confidence * 100)}%;background:${riskColors[p.riskLevel] || 'var(--primary)'}"></div></div>` : ''}

  }

let adminTab = 'providers';
async function renderAdmin(params) {
  const content = document.getElementById('content-area');
  if (currentProvider && currentProvider.role !== 'admin') {
    content.innerHTML = '<div class="alert alert-error">You do not have access to this section.</div>';
    return;
  }
  adminTab = params.tab || 'providers';
  content.innerHTML = `
    <div class="tabs" id="admin-tabs">
      <div class="tab ${adminTab==='providers'?'active':''}" onclick="switchAdminTab('providers')">Providers</div>
      <div class="tab ${adminTab==='roles'?'active':''}" onclick="switchAdminTab('roles')">Roles</div>
      <div class="tab ${adminTab==='audit'?'active':''}" onclick="switchAdminTab('audit')">Audit Log</div>
    </div>
    <div id="admin-tab-content"><div class="spinner"></div></div>`;
  loadAdminTab(adminTab);
}

function switchAdminTab(tab) {
  adminTab = tab;
  document.querySelectorAll('#admin-tabs .tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().includes(tab === 'audit' ? 'audit' : tab)));
  const tc = document.getElementById('admin-tab-content');
  tc.innerHTML = '<div class="spinner"></div>';
  loadAdminTab(tab);
}

async function loadAdminTab(tab) {
  const tc = document.getElementById('admin-tab-content');
  if (!tc) return;
  if (tab === 'providers') await loadAdminProviders(tc);
  else if (tab === 'roles') await loadAdminRoles(tc);
  else if (tab === 'audit') await loadAdminAudit(tc, 1);
}

          <td>${escapeHtml(p.email)}</td>
          <td><span class="badge badge-${p.role==='admin'?'purple':'blue'}">${escapeHtml(p.role)}</span></td>

    container.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;

async function openEditProviderModal(id) {
  try {
    const providers = await apiFetch('/admin/providers');
    const p = providers.find(x => x.id === id);
    if (!p) { showToast('Provider not found', 'error'); return; }
    openModal('Edit Provider', `
      <div class="form-row"><div class="form-group"><label class="form-label">Name</label><input class="form-input" id="edit-prov-name" value="${escapeHtml(p.name)}"></div>
      <div class="form-group"><label class="form-label">Role</label><select class="form-input" id="edit-prov-role"><option value="provider" ${p.role==='provider'?'selected':''}>Provider</option><option value="admin" ${p.role==='admin'?'selected':''}>Admin</option><option value="nurse" ${p.role==='nurse'?'selected':''}>Nurse</option><option value="staff" ${p.role==='staff'?'selected':''}>Staff</option></select></div></div>
      <div class="form-row"><div class="form-group"><label class="form-label">Specialty</label><input class="form-input" id="edit-prov-specialty" value="${escapeHtml(p.specialty || '')}"></div>
      <div class="form-group"><label class="form-label">Organization</label><input class="form-input" id="edit-prov-org" value="${escapeHtml(p.organization || '')}"></div></div>
      <div class="form-row"><div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="edit-prov-phone" value="${escapeHtml(p.phone || '')}"></div>
      <div class="form-group"><label class="form-label">NPI Number</label><input class="form-input" id="edit-prov-npi" value="${escapeHtml(p.npiNumber || '')}"></div></div>
      <div class="form-group"><label class="form-label">New Password (leave blank to keep current)</label><input class="form-input" id="edit-prov-password" type="password"></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="updateProvider('${id}')">Save Changes</button>`);
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function updateProvider(id) {
  try {
    const body = {
      name: document.getElementById('edit-prov-name').value,
      role: document.getElementById('edit-prov-role').value,
      specialty: document.getElementById('edit-prov-specialty').value,
      organization: document.getElementById('edit-prov-org').value,
      phone: document.getElementById('edit-prov-phone').value,
      npiNumber: document.getElementById('edit-prov-npi').value
    };
    const pw = document.getElementById('edit-prov-password').value;
    if (pw) body.password = pw;
    await apiFetch(`/admin/providers/${id}`, { method: 'PUT', body: JSON.stringify(body) });
    closeModal();
    showToast('Provider updated successfully');
    loadAdminTab('providers');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deactivateProvider(id) {
  if (!confirm('Are you sure you want to deactivate this provider?')) return;
  try {
    await apiFetch(`/admin/providers/${id}`, { method: 'DELETE' });
    showToast('Provider deactivated');
    loadAdminTab('providers');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

let auditPage = 1;
async function loadAdminAudit(container, page) {
  auditPage = page || 1;
  try {
    const data = await apiFetch(`/admin/audit-log?page=${auditPage}&limit=20`);
    const logs = data.logs || [];
    const pg = data.pagination || {};
    container.innerHTML = `
      ${logs.length > 0 ? `<div class="table-wrap"><table>
        <thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Resource</th><th>IP Address</th></tr></thead>
        <tbody>${logs.map(l => `<tr>
          <td>${formatDate(l.createdAt)}</td>
          <td>${escapeHtml(l.userId || '-')}</td>
          <td>${escapeHtml(l.action || '-')}</td>
          <td>${escapeHtml(l.resourceType || '')} ${l.resourceId ? '(' + escapeHtml(l.resourceId) + ')' : ''}</td>
          <td>${escapeHtml(l.ipAddress || '-')}</td>
        </tr>`).join('')}</tbody></table></div>
        <div class="pagination">
          <button ${auditPage <= 1 ? 'disabled' : ''} onclick="loadAdminAudit(document.getElementById('admin-tab-content'),${auditPage - 1})">Previous</button>
          <span>Page ${pg.page || auditPage} of ${pg.totalPages || 1}</span>
          <button ${auditPage >= (pg.totalPages || 1) ? 'disabled' : ''} onclick="loadAdminAudit(document.getElementById('admin-tab-content'),${auditPage + 1})">Next</button>
        </div>` : '<div class="empty-state"><h3>No audit logs</h3><p>Activity will appear here as actions are performed.</p></div>'}`;
  } catch (err) {
    container.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  }
}

async function renderTasks(params) {
  const content = document.getElementById('content-area');
  content.innerHTML = `
    <div class="filter-bar">
      <select class="form-input" id="task-status-filter" onchange="loadTasks()">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
      <select class="form-input" id="task-priority-filter" onchange="loadTasks()">
        <option value="">All Priorities</option>
        <option value="urgent">Urgent</option>
        <option value="high">High</option>
        <option value="normal">Normal</option>
        <option value="low">Low</option>
      </select>
      <div style="margin-left:auto"><button class="btn btn-primary" onclick="openNewTaskModal()">+ New Task</button></div>
    </div>
    <div id="task-list"><div class="spinner"></div></div>`;
  loadTasks();
}

async function loadTasks() {
  const listEl = document.getElementById('task-list');
  if (!listEl) return;
  listEl.innerHTML = '<div class="spinner"></div>';
  try {
    const tasks = await apiFetch('/tasks');
    const statusFilter = document.getElementById('task-status-filter')?.value || '';
    const priorityFilter = document.getElementById('task-priority-filter')?.value || '';
    let filtered = tasks;
    if (statusFilter) filtered = filtered.filter(t => t.status === statusFilter);
    if (priorityFilter) filtered = filtered.filter(t => t.priority === priorityFilter);
    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><h3>No tasks found</h3><p>Create a new task to get started.</p></div>';
      return;
    }
    const priorityColors = { urgent: 'red', high: 'amber', normal: 'blue', low: 'gray' };
    const statusBadge = { pending: 'amber', in_progress: 'blue', completed: 'green' };
    listEl.innerHTML = filtered.map(t => `
      <div class="task-card">
        <div class="task-header">
          <div class="task-title">${escapeHtml(t.title)}</div>
          <span class="badge badge-${priorityColors[t.priority] || 'gray'}">${escapeHtml(t.priority || 'normal')}</span>
        </div>
        ${t.description ? `<div style="font-size:13px;color:var(--text-light);margin-bottom:8px">${escapeHtml(t.description)}</div>` : ''}
        <div class="task-meta">
          <span class="badge badge-${statusBadge[t.status] || 'gray'}">${escapeHtml((t.status || '').replace('_', ' '))}</span>
          ${t.taskType ? `<span class="badge badge-gray">${escapeHtml(t.taskType.replace('_', ' '))}</span>` : ''}
          ${t.dueDate ? `<span>Due: ${formatShortDate(t.dueDate)}</span>` : ''}
          ${t.patientId ? `<span>Patient: ${escapeHtml(t.patientId)}</span>` : ''}
        </div>
        <div class="task-actions">
          <select class="status-select" onchange="updateTaskStatus('${t.id}',this.value)">
            <option value="pending" ${t.status==='pending'?'selected':''}>Pending</option>
            <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
            <option value="completed" ${t.status==='completed'?'selected':''}>Completed</option>
          </select>
        </div>
      </div>`).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="alert alert-error">Failed to load tasks: ${escapeHtml(err.message)}</div>`;
  }
}

function openNewTaskModal() {
  openModal('New Task', `
    <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="task-title" placeholder="Task title" required></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="task-desc" placeholder="Task description..."></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Type</label><select class="form-input" id="task-type"><option value="follow_up">Follow Up</option><option value="review_results">Review Results</option><option value="call_patient">Call Patient</option><option value="prescription">Prescription</option><option value="referral">Referral</option><option value="documentation">Documentation</option><option value="other">Other</option></select></div>
      <div class="form-group"><label class="form-label">Priority</label><select class="form-input" id="task-priority"><option value="normal">Normal</option><option value="low">Low</option><option value="high">High</option><option value="urgent">Urgent</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Due Date</label><input class="form-input" id="task-due" type="date"></div>
      <div class="form-group"><label class="form-label">Patient ID (optional)</label><input class="form-input" id="task-patient" placeholder="Patient ID"></div>
    </div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createTask()">Create Task</button>`);
}

async function createTask() {
  try {
    await apiFetch('/tasks', {
      method: 'POST',
      body: JSON.stringify({
        title: document.getElementById('task-title').value,
        description: document.getElementById('task-desc').value,
        taskType: document.getElementById('task-type').value,
        priority: document.getElementById('task-priority').value,
        dueDate: document.getElementById('task-due').value || null,
        patientId: document.getElementById('task-patient').value || null
      })
    });
    closeModal();
    showToast('Task created successfully');
    loadTasks();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function updateTaskStatus(id, status) {
  try {
    await apiFetch(`/tasks/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ status })
    });
    showToast('Task status updated');
    loadTasks();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function init() {
  const savedToken = localStorage.getItem('portal_token');
  const savedProvider = localStorage.getItem('portal_provider');
  if (savedToken && savedProvider) {
    currentToken = savedToken;
    try { currentProvider = JSON.parse(savedProvider); } catch (e) { currentProvider = null; }
    buildSidebar();
  }
  if (!window.location.hash || window.location.hash === '#') {
    window.location.hash = currentToken ? '#dashboard' : '#login';
  } else {
    route();
  }
}

init();
</script>
