# Managed by gen-dependabot.sh — version updates, minor+patch grouped
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/artifacts mockup-sandbox "
      - "/modules expo-cac-reader "
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]