name: Mobile iOS — Build & Submit (EAS)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "build-and-submit"
        type: choice
        options:
          - build
          - submit
          - build-and-submit
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
          - development

concurrency:
  group: mobile-ios-submit
  cancel-in-progress: false

jobs:
  ios:
    name: EAS iOS (${{ inputs.action }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest
    # SCAFFOLD-IN-WAITING — DO NOT REMOVE THIS GUARD WITHOUT EXPLICIT GREENLIGHT.
    # See .local/deliverables/f1-action-items.md → Action Item AF-2 for activation
    # criteria. The pipeline must NOT fire until:
    #   1. Mobile-only Build #41 has shipped + Apple-approved
    #   2. AF-3 (port 3 monetization commits + Apple-rejection fixes + RevenueCat
    #      IAP + axios CVE) has merged into the unified repo
    #   3. A test workflow_dispatch (build only, no submit) from unified passes
    # Until all three are met, this job no-ops.
    if: ${{ false }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tabula-medica-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
      EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tabula-medica-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify EAS auth
        run: npx --yes eas-cli@latest whoami

      - name: EAS Build (iOS, ${{ inputs.profile }})
        if: inputs.action == 'build' || inputs.action == 'build-and-submit'
        run: |
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait

      - name: EAS Submit (iOS, latest production build)
        if: inputs.action == 'submit' || inputs.action == 'build-and-submit'
        run: |
          npx --yes eas-cli@latest submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive
