name: PR security check

# Restored per the security-closure plan (P2-2). Runs the reliably-green gates on
# every PR + push to main:
#   - PHI-AI boundary guard (non-BAA AI endpoint URLs)
#   - ESLint guardrail (PHI string-form logger = error; fallback-identity = warn)
#   - build (esbuild — catches import/syntax regressions fast)
#   - authz-sweep against an ephemeral Postgres (best-effort; needs the server to
#     boot, so it is non-blocking until staging secrets are wired — see notes).
#
# NOTE: `npm run check` (full tsc) is intentionally NOT a hard gate yet — the tree
# has ~1,306 pre-existing type errors (tracked separately). It runs informationally.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci

      # --- Hard gates (green today) ---
      - name: PHI-AI boundary guard
        run: bash scripts/phi-ai-guard.sh

      - name: Build (esbuild)
        run: npm run build

      # --- Informational (pre-existing baseline debt, tracked separately) ---
      # ESLint server baseline has ~198 pre-existing errors (105 no-restricted-syntax
      # PHI-db guardrail + 12 no-string-form-logger + generic) and ~624
      # no-fallback-identity WARNINGS from the P0-5 legitimate-keep set. Gate is
      # informational until that debt is burned down; the fallback rule flips
      # WARN -> ERROR once `grep -rF '|| "system"' server/` is fully clean.
      - name: ESLint guardrail (informational)
        continue-on-error: true
        run: npx eslint server

      # Full tsc has ~1,306 pre-existing type errors; informational until paid down.
      - name: Typecheck (informational — baseline is red)
        continue-on-error: true
        run: npm run check

  authz-sweep:
    runs-on: ubuntu-latest
    # Non-blocking until the server can boot in CI with a seeded test DB + minimal
    # secrets. The static route extraction always runs; the live probes only
    # execute if the server comes up.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tabula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tabula_test
      NODE_ENV: test
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Boot server (background) and wait
        run: |
          (npm run dev &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health >/dev/null 2>&1 && break
            sleep 2
          done
      - name: Authz sweep (unauthenticated probe)
        run: BASE_URL=http://localhost:8080 node scripts/authz-sweep.mjs
