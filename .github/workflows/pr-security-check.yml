name: PR Security & Quality Gate

on:
  pull_request:
    branches: [main]

jobs:
  pr-metadata:
    name: PR Audit Trail
    runs-on: ubuntu-latest
    steps:
      - name: Record PR metadata for SOC2 audit
        run: |
          cat <<EOF
          ═══════════════════════════════════════════════
          SOC2 PR AUDIT RECORD
          ═══════════════════════════════════════════════
          PR Number:    #${{ github.event.pull_request.number }}
          Title:        ${{ github.event.pull_request.title }}
          Author:       ${{ github.event.pull_request.user.login }}
          Base Branch:  ${{ github.base_ref }}
          Head Branch:  ${{ github.head_ref }}
          Commit SHA:   ${{ github.sha }}
          Timestamp:    $(date -u +%Y-%m-%dT%H:%M:%SZ)
          ═══════════════════════════════════════════════
          EOF

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (critical/high)
        run: npm audit --audit-level=high --omit=dev || true
      - name: Check for known vulnerabilities
        run: npx audit-ci@^7 --high || echo "::warning::Dependency vulnerabilities found"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t ${{ github.event.repository.name }}:pr-${{ github.event.pull_request.number }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ github.event.repository.name }}:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  pr-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, dependency-audit, secret-scan, sast, dockerfile-lint, build-verify]
    steps:
      - name: Summarize gate results
        run: |
          echo "## SOC2 PR Security Gate Results"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Type Check | ${{ needs.typecheck.result }} |"
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |"
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |"
          echo "| SAST | ${{ needs.sast.result }} |"
          echo "| Dockerfile Lint | ${{ needs.dockerfile-lint.result }} |"
          echo "| Build Verify | ${{ needs.build-verify.result }} |"
