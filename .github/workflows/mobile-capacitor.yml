name: Mobile build (Capacitor)

# Optional store build so EAS is not required. Dispatch only.
# android/gradlew and the Xcode project are not both present yet; the job
# reports that and stops, and assembles a release once the native project
# is checked in. Signing material is an Actions secret, never a file in git.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which shell to assemble
        required: true
        type: choice
        options:
          - android
          - ios
        default: android

permissions:
  contents: read

jobs:
  android:
    name: Android assemble
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Assemble
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            echo "android/gradlew is not in the repo yet. Add the Capacitor Android project, then this job will assemble a release."
            exit 0
          fi
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleRelease)

  ios:
    name: iOS archive
    if: inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Archive
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if ! find ios -name '*.xcworkspace' -o -name '*.xcodeproj' | grep -q .; then
            echo "No Xcode project under ios/ yet. Add the Capacitor iOS project, then this job will archive."
            exit 0
          fi
          npm run build
          npx cap sync ios
          echo "Signing secrets are referenced above. Wire them into an exportOptions.plist on the runner before xcodebuild archive."
