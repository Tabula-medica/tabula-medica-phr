name: Strix pentest

# Runs the Strix AI pentest agent against a disposable instance of the app on
# every pull request. Non-negotiables (see CLAUDE.md):
#   - Strix is LLM-driven, so every request/response it sees reaches the model.
#     The model is routed to Vertex AI (Google BAA) only; never set STRIX_LLM to
#     an OpenAI/Anthropic/consumer-Gemini model here.
#   - The database holds synthetic data only (fresh Postgres service, schema
#     pushed, no production data, no real credentials).
# Auth: Workload Identity Federation — no long-lived SA key stored anywhere.
# Required repo secrets: STRIX_WIF_PROVIDER (WIF provider resource name),
#   STRIX_WIF_SA (strix-ci SA email), STRIX_VERTEX_PROJECT.
# Optional var: STRIX_VERTEX_LOCATION (default us-central1).
# Fork PRs have no access to secrets, so the job is skipped for them.

on:
  pull_request:

permissions:
  contents: read
  id-token: write   # required for WIF OIDC token exchange

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: strix
          POSTGRES_DB: strix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:strix@localhost:5432/strix
      PORT: "8080"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Google Cloud (WIF — no SA key)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.STRIX_WIF_PROVIDER }}
          service_account: ${{ secrets.STRIX_WIF_SA }}
          token_format: access_token

      - name: Check Vertex secrets
        env:
          WIF_PROVIDER: ${{ secrets.STRIX_WIF_PROVIDER }}
          VERTEX_PROJECT: ${{ secrets.STRIX_VERTEX_PROJECT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$VERTEX_PROJECT" ]; then
            echo "::error::Set repo secrets STRIX_WIF_PROVIDER, STRIX_WIF_SA, and STRIX_VERTEX_PROJECT. Strix must use Vertex AI (Google BAA) only."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Push schema to disposable database
        run: npm run db:push -- --force

      # Run the production bundle, not tsx: only the build aliases `openai` to the
      # Vertex shim, and the un-aliased dev server crashes at boot without an OpenAI key.
      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          NODE_ENV=production nohup node dist/index.cjs > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/ >/dev/null && exit 0
            sleep 2
          done
          cat app.log
          exit 1

      - name: Install Strix (with Vertex support)
        run: pipx install --force "strix-agent[vertex]"

      - name: Strix scan (Vertex AI, synthetic data)
        env:
          STRIX_LLM: vertex_ai/gemini-2.5-pro
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          VERTEXAI_PROJECT: ${{ secrets.STRIX_VERTEX_PROJECT }}
          VERTEXAI_LOCATION: ${{ vars.STRIX_VERTEX_LOCATION || 'us-central1' }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.strix/bin:$PATH"
          strix -n --target http://localhost:8080 --scan-mode quick

      - name: Upload Strix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-runs
          path: strix_runs/
          if-no-files-found: ignore
