name: Dependency & secret exposure scan

# CrowdStrike 2026 Threat Hunting Report: 88% of observed vulnerability
# exploitation began within 48 hours of a public PoC. A weekly Dependabot
# cadence leaves a multi-day window, so this workflow runs OSV-Scanner and
# `npm audit` on every PR/push AND on a daily schedule, failing loudly on
# high/critical findings. Ignore-list lives in osv-scanner.toml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv-scanner:
    # Blocking, every severity. Fix findings with npm overrides in
    # package.json; an IgnoredVulns entry in osv-scanner.toml is allowed only
    # for a breaking-major fix a direct dependency cannot consume, with the
    # reason recorded there.
    name: OSV-Scanner (lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV-Scanner (pinned release binary)
        env:
          OSV_VERSION: v2.2.3
          # SHA-256 of osv-scanner_linux_amd64 for this exact pinned tag, so a
          # swapped/compromised release asset fails closed instead of
          # executing with the CI job's permissions. Bump alongside
          # OSV_VERSION (re-derive with `sha256sum` on the new asset).
          OSV_SHA256: 8cdb138b36cdb9c99c455cafb32a1c83e1823448dc00e1c8ab9afe474a5e93f0
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Scan root lockfile
        run: osv-scanner scan --config=osv-scanner.toml --lockfile=package-lock.json --format=table

  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

  phi-siem-fields:
    name: SIEM forwarder PHI allowlist test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run security-layer unit tests
        run: npx vitest run tests/siem-forwarder.spec.ts tests/ai-runtime-guard.spec.ts tests/session-binding.spec.ts tests/pg-rate-limit-store.spec.ts tests/dod-cac-auth.spec.ts

  pg-rate-limit-integration:
    # Proves properties the fake-based unit specs can't: that real
    # concurrent connections to Postgres serialize through the rate limit
    # store's ON CONFLICT upsert into an exact count (and that two separate
    # store instances sharing a database, standing in for two Cloud Run
    # replicas, see each other's increments), and separately, that the
    # CAC/PIV enrollment handler's ON CONFLICT DO NOTHING / WHERE-gated
    # DO UPDATE patterns actually serialize two simultaneous connections
    # into exactly one winner rather than just running one mock call before
    # another in-process. Tables are created here as test fixture setup
    # only — the app itself never runs DDL against a real database (schema
    # changes go through Drizzle/db:push); each spec creates its own
    # isolated schema, so they can't collide with each other or with a
    # real deployment's public schema.
    name: Postgres integration tests (rate limiter, CAC enrollment)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rate_limit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run Postgres-backed integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rate_limit_test
        run: npx vitest run tests/pg-rate-limit-store.integration.spec.ts tests/cac-enrollment-atomicity.integration.spec.ts
